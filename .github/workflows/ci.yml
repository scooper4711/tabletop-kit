name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and coverage
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Lint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint --strict --quiet

      # Tests that read Paizo's PDFs read sample pages of them from the private toolkit-artwork repository, of
      # which only test-pdfs/ is checked out. Pull requests from forks have no key, and skip those tests.
      - name: Fetch the sample PDFs
        env:
          ARTWORK_SSH_KEY: ${{ secrets.ARTWORK_SSH_KEY }}
        if: env.ARTWORK_SSH_KEY != ''
        run: |
          printf '%s\n' "$ARTWORK_SSH_KEY" > "$RUNNER_TEMP/artwork_key"
          chmod 600 "$RUNNER_TEMP/artwork_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/artwork_key -o IdentitiesOnly=yes"
          git clone --depth 1 --filter=blob:none --sparse git@github.com:scooper4711/toolkit-artwork.git \
            "$RUNNER_TEMP/toolkit-artwork"
          git -C "$RUNNER_TEMP/toolkit-artwork" sparse-checkout set test-pdfs
          echo "TOOLKIT_TEST_PDFS=$RUNNER_TEMP/toolkit-artwork/test-pdfs" >> "$GITHUB_ENV"

      - name: Test with coverage gate
        run: scripts/coverage.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/sonar-coverage.xml

      - name: Build for iOS
        run: xcodebuild -scheme TabletopKit-Package -destination 'generic/platform=iOS Simulator' -quiet build

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    # Pull requests from forks have no access to the token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
